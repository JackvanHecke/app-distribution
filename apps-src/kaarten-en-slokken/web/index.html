<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kaarten &amp; Slokken</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky "tafelbalk" with the player count; game list as a hand of playing cards; each game opens as a rulebook page. */
:root {
  --ground: #E9EEEA;
  --card: #FFFFFF;
  --ink: #17211C;
  --muted: #56645C;
  --line: #CFD8D2;
  --red: #C81F36;
  --amber: #E39C12;
  --amber-ink: #3A2600;
  --felt: #1F4D3A;
  --felt-ink: #F2F7F3;
  --good: #1E7A4C;
  --warn: #A86400;
  --bad: #9A2B2B;
  --shadow: 0 1px 0 rgba(23,33,28,.06), 0 6px 18px -8px rgba(23,33,28,.25);
  --f-display: "Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0E1713; --card: #17241E; --ink: #E7EFEA; --muted: #9AABA1; --line: #2A3A32;
    --red: #FF6177; --amber: #F2B53C; --amber-ink: #2B1C00; --felt: #143A2B; --felt-ink: #E7EFEA;
    --good: #5ACB8E; --warn: #F0B04F; --bad: #FF7B7B;
    --shadow: 0 1px 0 rgba(0,0,0,.3), 0 8px 22px -10px rgba(0,0,0,.7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #0E1713; --card: #17241E; --ink: #E7EFEA; --muted: #9AABA1; --line: #2A3A32;
  --red: #FF6177; --amber: #F2B53C; --amber-ink: #2B1C00; --felt: #143A2B; --felt-ink: #E7EFEA;
  --good: #5ACB8E; --warn: #F0B04F; --bad: #FF7B7B;
  --shadow: 0 1px 0 rgba(0,0,0,.3), 0 8px 22px -10px rgba(0,0,0,.7);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--ground); color: var(--ink);
  font-family: var(--f-body); font-size: 16px; line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--felt); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; line-height: 1.1; margin: 0; }

/* Tafelbalk */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--felt); color: var(--felt-ink);
  border-bottom: 1px solid rgba(0,0,0,.2);
}
.bar-in, .wrap {
  max-width: 1080px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.bar-in { display: flex; align-items: center; gap: 12px 20px; flex-wrap: wrap; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; cursor: pointer; margin-right: auto; }
.brand-mark { display: grid; place-items: center; width: 34px; height: 46px; border-radius: 6px; background: var(--card); color: var(--red); font-size: 22px; box-shadow: 0 2px 0 rgba(0,0,0,.25); transform: rotate(-6deg); }
.brand-name { font-family: var(--f-display); font-weight: 800; font-size: 1.3rem; letter-spacing: -.01em; color: var(--felt-ink); }
.ctrl { display: flex; align-items: center; gap: 8px; }
.ctrl-label { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; opacity: .8; font-weight: 600; }
.stepper { display: flex; align-items: center; background: rgba(255,255,255,.1); border-radius: 999px; padding: 3px; }
.stepper button { width: 34px; height: 34px; border-radius: 50%; border: 0; background: rgba(255,255,255,.14); color: var(--felt-ink); font-size: 1.2rem; font-weight: 700; cursor: pointer; line-height: 1; }
.stepper button:hover { background: rgba(255,255,255,.26); }
.stepper button:disabled { opacity: .35; cursor: default; }
.stepper output { min-width: 2.4ch; text-align: center; font-family: var(--f-mono); font-size: 1.25rem; font-weight: 500; font-variant-numeric: tabular-nums; }
.seg { display: flex; background: rgba(255,255,255,.1); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: transparent; color: var(--felt-ink); padding: 6px 12px; border-radius: 999px; font-size: .85rem; font-weight: 600; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--amber); color: var(--amber-ink); }

/* Home */
.intro { padding-block: 36px 8px; display: grid; gap: 10px; }
.intro h1 { font-size: clamp(2rem, 5.5vw, 3.4rem); font-weight: 800; letter-spacing: -.025em; max-width: 16ch; }
.intro h1 em { font-style: normal; color: var(--red); }
.intro p { margin: 0; color: var(--muted); max-width: 60ch; font-size: 1.05rem; }
.filterrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-block: 18px 14px; }
.filterrow .count { font-size: .95rem; color: var(--muted); }
.filterrow .count b { color: var(--ink); }
.toggle { display: inline-flex; align-items: center; gap: 8px; font-size: .9rem; color: var(--muted); cursor: pointer; }
.toggle input { width: 18px; height: 18px; accent-color: var(--felt); }

.hand { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 18px; padding-bottom: 40px; }
.pcard {
  position: relative; text-align: left; cursor: pointer;
  background: var(--card); border: 1px solid var(--line); border-radius: 14px;
  padding: 18px 18px 46px 52px; min-height: 200px;
  box-shadow: var(--shadow);
  display: flex; flex-direction: column; gap: 8px;
  transition: transform .18s ease, box-shadow .18s ease;
}
.pcard:hover { transform: translateY(-4px) rotate(-.6deg); }
.pcard.off { opacity: .55; }
.idx { position: absolute; display: flex; flex-direction: column; align-items: center; line-height: 1; font-family: var(--f-display); font-weight: 800; }
.idx .r { font-size: 1.25rem; }
.idx .s { font-size: 1.1rem; margin-top: 2px; }
.idx.tl { top: 14px; left: 14px; }
.idx.br { bottom: 12px; right: 14px; transform: rotate(180deg); }
.red { color: var(--red); }
.pcard h2 { font-size: 1.45rem; font-weight: 750; letter-spacing: -.01em; }
.pcard p { margin: 0; font-size: .93rem; color: var(--muted); }
.meta { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: .8rem; color: var(--muted); font-family: var(--f-mono); margin-top: auto; }
.fit { align-self: flex-start; font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; padding: 3px 9px; border-radius: 999px; border: 1.5px solid currentColor; }
.fit.ideal { color: var(--good); }
.fit.kan { color: var(--warn); }
.fit.niet { color: var(--bad); }

/* Detail */
.back { display: inline-flex; align-items: center; gap: 6px; margin-top: 22px; border: 0; background: none; color: var(--muted); font-weight: 600; cursor: pointer; padding: 6px 0; }
.back:hover { color: var(--ink); }
.ghero { display: grid; grid-template-columns: auto 1fr; gap: 22px; align-items: center; padding-block: 14px 26px; }
.bigcard { width: 104px; height: 144px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); position: relative; display: grid; place-items: center; font-size: 3rem; transform: rotate(-4deg); }
.bigcard .idx.tl { top: 8px; left: 9px; }
.bigcard .idx.br { bottom: 8px; right: 9px; }
.ghero h1 { font-size: clamp(2.1rem, 6vw, 3.6rem); font-weight: 800; letter-spacing: -.025em; }
.ghero .tag { margin: 6px 0 12px; color: var(--muted); font-size: 1.08rem; max-width: 55ch; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font-size: .82rem; padding: 4px 10px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); font-weight: 600; }
.chip span { color: var(--muted); font-weight: 500; }

.cols { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 28px; align-items: start; padding-bottom: 48px; }
.aside { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px); display: grid; gap: 16px; }
.table-panel { background: var(--felt); color: var(--felt-ink); border-radius: 16px; padding: 20px; display: grid; gap: 14px; }
.table-panel h3 { font-size: 1.15rem; }
.table-panel .warnbox { background: rgba(255,255,255,.12); border-radius: 10px; padding: 10px 12px; font-size: .9rem; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat { background: rgba(255,255,255,.08); border-radius: 10px; padding: 10px 12px; min-width: 0; }
.stat b { display: block; font-family: var(--f-mono); font-size: 1.35rem; font-weight: 500; font-variant-numeric: tabular-nums; line-height: 1.2; }
.stat small { font-size: .78rem; opacity: .85; }
.stat.wide { grid-column: 1 / -1; }
.roles { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.roles li { display: flex; justify-content: space-between; gap: 10px; font-size: .92rem; padding: 6px 10px; background: rgba(255,255,255,.08); border-radius: 8px; }
.roles li span:last-child { opacity: .8; font-family: var(--f-mono); font-size: .8rem; }
.panel-note { font-size: .86rem; opacity: .9; margin: 0; }

.sec { display: grid; gap: 12px; padding-block: 6px 26px; }
.sec + .sec { border-top: 1px solid var(--line); padding-top: 24px; }
.sec h2 { font-size: 1.45rem; font-weight: 750; display: flex; align-items: center; gap: 10px; }
.sec h2 .pip { font-size: 1.1rem; }
.sec p { margin: 0; max-width: 65ch; }
.steps { margin: 0; padding: 0; list-style: none; counter-reset: s; display: grid; gap: 10px; max-width: 68ch; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; }
.steps li::before { content: counter(s); font-family: var(--f-mono); font-size: .85rem; font-weight: 500; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid var(--line); color: var(--muted); margin-top: -1px; }
.bul { margin: 0; padding-left: 1.2em; display: grid; gap: 8px; max-width: 68ch; }

.drinks { display: grid; gap: 8px; }
.drink { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.drink .w { font-weight: 600; }
.drink .n { font-size: .88rem; color: var(--muted); margin-top: 2px; }
.coaster { width: 62px; height: 62px; border-radius: 50%; background: var(--amber); color: var(--amber-ink); display: grid; place-content: center; text-align: center; box-shadow: inset 0 0 0 4px rgba(255,255,255,.35), inset 0 0 0 6px var(--amber); line-height: 1; }
.coaster b { font-family: var(--f-display); font-weight: 800; font-size: 1.35rem; }
.coaster small { font-size: .62rem; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; margin-top: 2px; }
.coaster.txt b { font-size: .9rem; }
.slok { display: inline-block; background: var(--amber); color: var(--amber-ink); font-weight: 700; font-size: .85em; padding: 0 .5em; border-radius: 999px; white-space: nowrap; }

.cardrules { display: grid; gap: 6px; }
.crule { display: grid; grid-template-columns: 52px 1fr; gap: 12px; align-items: start; padding: 10px 12px; border-radius: 10px; border: 1px solid transparent; transition: background .2s, border-color .2s; }
.crule.hit { background: var(--card); border-color: var(--amber); box-shadow: var(--shadow); }
.crank { width: 40px; height: 54px; border-radius: 6px; background: var(--card); border: 1px solid var(--line); display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 1.1rem; }
.crule b { display: block; }
.crule span { font-size: .93rem; color: var(--muted); }
.draw { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; background: var(--card); border: 1px dashed var(--line); border-radius: 14px; padding: 14px; }
.btn { border: 0; background: var(--ink); color: var(--card); font-weight: 700; padding: 10px 16px; border-radius: 999px; cursor: pointer; }
.btn:hover { opacity: .88; }
.drawn { width: 58px; height: 80px; border-radius: 8px; border: 1px solid var(--line); background: var(--ground); display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 1.3rem; line-height: 1.05; text-align: center; }
.drawn.flip { animation: flip .35s ease; }
@keyframes flip { from { transform: rotateY(90deg); } to { transform: rotateY(0); } }
.drawtxt { flex: 1 1 180px; min-width: 0; font-size: .95rem; }
.drawtxt b { display: block; }

.foot { border-top: 1px solid var(--line); padding-block: 22px 34px; color: var(--muted); font-size: .88rem; }
.foot p { margin: 0; max-width: 70ch; }

@media (max-width: 860px) {
  .cols { grid-template-columns: minmax(0, 1fr); }
  .aside { position: static; order: -1; }
}
@media (max-width: 520px) {
  .bar-in { gap: 10px; }
  .brand { width: 100%; }
  .ctrl-label { display: none; }
  .ghero { grid-template-columns: 1fr; }
  .bigcard { width: 76px; height: 104px; font-size: 2.2rem; }
  .pcard { min-height: 0; }
}
/* ---------- Beweging ---------- */
.intro { grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px 32px; }
.intro-text { display: grid; gap: 10px; min-width: 0; }
.table-fan { display: grid; justify-items: center; gap: 6px; }
.fan { position: relative; width: 300px; max-width: 80vw; height: 180px; animation: sway 6s ease-in-out infinite alternate; transform-origin: 50% 100%; }
.seat {
  position: absolute; left: calc(50% - 31px); bottom: 0; width: 62px; height: 88px;
  border-radius: 7px; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow);
  display: grid; place-items: center; font-size: 1.35rem; font-family: var(--f-display); font-weight: 800;
  transform-origin: 50% 115%;
  transform: rotate(var(--a)) translateY(-14px);
  animation: fanout .6s cubic-bezier(.2,.9,.25,1.25) backwards;
  animation-delay: calc(var(--k) * 30ms);
}
.seat:nth-child(odd) { background: linear-gradient(160deg, var(--card), var(--ground)); }
.fan-cap { font-family: var(--f-mono); font-size: .85rem; color: var(--muted); }
.fan-cap b { color: var(--ink); font-weight: 500; }
@keyframes fanout { from { transform: rotate(0deg) translateY(0); opacity: .2; } }
@keyframes sway { from { transform: rotate(-2deg); } to { transform: rotate(2deg); } }

.pcard { transform: perspective(800px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) translateY(var(--lift, 0px)); transition: transform .25s ease, box-shadow .25s ease; will-change: transform; }
.pcard:hover { transform: perspective(800px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) translateY(-6px); box-shadow: 0 2px 0 rgba(23,33,28,.06), 0 18px 32px -14px rgba(23,33,28,.45); }
.pcard::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: radial-gradient(240px circle at var(--gx, 50%) var(--gy, 0%), rgba(255,255,255,.35), transparent 60%); opacity: 0; transition: opacity .25s; }
.pcard:hover::after { opacity: 1; }
.enter .pcard { animation: deal .6s cubic-bezier(.2,.85,.25,1) backwards; animation-delay: calc(var(--i) * 70ms + 80ms); }
@keyframes deal { from { opacity: 0; transform: translate(var(--dx, 0px), -120px) rotate(var(--dr, -14deg)) scale(.85); } }

.enter .intro-text > * { animation: rise .55s cubic-bezier(.2,.8,.2,1) backwards; }
.enter .intro-text > *:nth-child(2) { animation-delay: .08s; }
.enter .ghero .bigcard { animation: dealbig .7s cubic-bezier(.2,.9,.3,1.2) backwards; }
.ghero .bigcard { animation: float 5s ease-in-out infinite alternate; }
.enter .ghero > div:last-child { animation: rise .5s .1s cubic-bezier(.2,.8,.2,1) backwards; }
.enter .sec, .enter .table-panel { animation: rise .55s cubic-bezier(.2,.8,.2,1) backwards; animation-delay: calc(var(--i, 0) * 70ms + 150ms); }
.enter .drink { animation: slidein .45s cubic-bezier(.2,.8,.2,1) backwards; animation-delay: calc(var(--i, 0) * 55ms + 400ms); }
@keyframes rise { from { opacity: 0; transform: translateY(18px); } }
@keyframes slidein { from { opacity: 0; transform: translateX(-16px); } }
@keyframes dealbig { from { opacity: 0; transform: translate(-60px, -80px) rotate(-40deg) scale(.6); } }
@keyframes float { from { transform: rotate(-5deg) translateY(0); } to { transform: rotate(-2deg) translateY(-6px); } }

.bump-n .stat b, .bump-n .fit, .bump-n .roles li, .bump-n .count b, .bump-n .steps li::before { animation: bump .45s cubic-bezier(.3,1.6,.5,1); }
.bump-n .roles li { animation-delay: calc(var(--i, 0) * 25ms); }
.bump-lv .coaster { animation: spin .6s cubic-bezier(.3,1.3,.5,1); }
.bump-lv .slok { animation: bump .45s cubic-bezier(.3,1.6,.5,1); }
@keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.18); } 100% { transform: scale(1); } }
@keyframes spin { from { transform: perspective(300px) rotateY(-180deg) scale(.8); } to { transform: perspective(300px) rotateY(0) scale(1); } }
.stat b, .fit, .roles li, .slok { display: inline-block; }
.stat b { display: block; transform-origin: left center; }

.coaster { transition: transform .3s cubic-bezier(.3,1.5,.5,1); }
.drink:hover .coaster { transform: rotate(-14deg) scale(1.06); }
.drink { transition: transform .2s ease, border-color .2s; }
.drink:hover { transform: translateX(4px); border-color: var(--amber); }
.btn { transition: transform .15s ease, opacity .15s; }
.btn:active { transform: scale(.95); }
.stepper button, .seg button { transition: background .2s, transform .12s; }
.stepper button:active { transform: scale(.88); }
.brand-mark { transition: transform .4s cubic-bezier(.3,1.6,.5,1); }
.brand:hover .brand-mark { transform: rotate(8deg) scale(1.08); }
.drawn { perspective: 600px; }
.drawn.flip { animation: flip3d .55s cubic-bezier(.2,.8,.3,1.2); }
@keyframes flip3d { 0% { transform: translateY(-30px) rotateY(180deg) scale(.7); opacity: .3; } 100% { transform: none; opacity: 1; } }
.crule.hit .crank { animation: bump .45s cubic-bezier(.3,1.6,.5,1); background: var(--amber); color: var(--amber-ink); border-color: var(--amber); }

@media (max-width: 720px) {
  .intro { grid-template-columns: minmax(0, 1fr); }
  .table-fan { justify-self: center; }
}
@media (hover: none) { .pcard::after { display: none; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; animation-delay: 0s !important; transition-duration: .01ms !important; }
  .pcard, .pcard:hover { transform: none; }
}
</style>
<style>html{color-scheme:light}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>

<header class="bar">
  <div class="bar-in">
    <button class="brand" id="home-btn" aria-label="Naar het overzicht">
      <span class="brand-mark" aria-hidden="true">♥</span>
      <span class="brand-name">Kaarten &amp; Slokken</span>
    </button>
    <div class="ctrl">
      <span class="ctrl-label" id="pl-label">Spelers</span>
      <div class="stepper" role="group" aria-labelledby="pl-label">
        <button id="pl-min" aria-label="Eén speler minder">−</button>
        <output id="pl-out" aria-live="polite">5</output>
        <button id="pl-plus" aria-label="Eén speler meer">+</button>
      </div>
    </div>
    <div class="ctrl">
      <span class="ctrl-label" id="lv-label">Slokken</span>
      <div class="seg" role="group" aria-labelledby="lv-label" id="level"></div>
    </div>
  </div>
</header>

<main id="app"></main>

<footer class="wrap foot">
  <p>Alleen voor 18+. Drink met mate en wissel af met water; een slok fris telt net zo goed. Niemand hoeft mee te drinken, en huisregels gaan altijd voor wat hier staat.</p>
</footer>

<script>
(function () {
  const RED = ["♥", "♦"];
  const LEVELS = [
    { id: "rustig", label: "Rustig" },
    { id: "normaal", label: "Normaal" },
    { id: "stevig", label: "Stevig" }
  ];
  const state = { n: 5, level: "normaal", onlyFit: false };
  try {
    const saved = JSON.parse(localStorage.getItem("kns") || "{}");
    if (saved.n >= 2 && saved.n <= 20) state.n = saved.n;
    if (LEVELS.some(l => l.id === saved.level)) state.level = saved.level;
    if (typeof saved.onlyFit === "boolean") state.onlyFit = saved.onlyFit;
  } catch (e) {}
  function save() { try { localStorage.setItem("kns", JSON.stringify(state)); } catch (e) {} }

  /* ---------- Slokken ---------- */
  function scale(x) {
    if (state.level === "rustig") return Math.max(1, Math.round(x / 2));
    if (state.level === "stevig") return x * 2;
    return x;
  }
  function slokWord(k) { return k === 1 ? "slok" : "slokken"; }
  const ADT = { rustig: "4 slokken", normaal: "half glas", stevig: "adtje" };
  function sipText(tok) {

      id: "hogerlager", name: "Hoger Lager", rank: "HL", suit: "♥",
      tagline: "Raad of de volgende kaart hoger of lager is. Hoe langer de reeks, hoe duurder een fout.",
      min: 2, max: 12, ideal: [3, 8], duration: "10–20 min", level: "Heel makkelijk",
      calc(n) {
        return {
          stats: [
            [1, "kaartspel (zonder jokers)"],
            [3, "goed op rij om door te geven"],
            ["≈ " + Math.round(51 / n), "gokken per speler per spel"],
            [n, "spelers in de kring"]
          ],
          note: "Het spel werkt met elk aantal spelers. Met veel mensen is het fijn om twee groepjes te maken."
        };
      },
      goal: "Zo veel mogelijk goed raden. Wie fout zit, drinkt voor elke kaart op de stapel.",
      prep: n => [
        "Schud één kaartspel zonder jokers en leg het dicht neer.",
        "Draai de bovenste kaart om en leg hem open in het midden. Dit is het begin van de stapel.",
        "Volgorde van laag naar hoog: 2 t/m 10, Boer, Vrouw, Heer, Aas."
      ],
      play: [
        "De eerste speler zegt ‘hoger’ of ‘lager’ en draait de volgende kaart om.",
        "Goed geraden? Leg de kaart op de stapel. Na drie keer goed op rij mag je doorgeven aan de volgende.",
        "Fout geraden? Drink voor elke kaart die op de stapel ligt. Daarna wordt de stapel weggelegd en begint het opnieuw met één kaart.",
        "Een gelijke kaart telt als fout.",
        "Het spel is afgelopen als de stapel op is."
      ],
      drinks: [
        { w: "Fout geraden", n: "Per kaart op de stapel. Een reeks van 6 kost dus 6 keer.", s: 1 },
        { w: "Gelijke kaart", n: "Telt als fout, en iedereen drinkt ook [[1]] mee.", s: 1 },
        { w: "Je raadt een hele reeks van 3 goed", n: "Deel uit en geef de beurt door.", s: 2 }
      ],
      tips: [
        "Bij Stevig kan dit snel oplopen. Spreek een maximum per fout af, bijvoorbeeld 10 slokken.",
        "Lage kaart open? Dan is ‘hoger’ bijna altijd veilig. Juist de middenkaarten (7, 8) maken het spannend."
      ]
    },
    {
      id: "dealertje", name: "Dealertje", rank: "D", suit: "♣",
      tagline: "Raad in twee pogingen welke kaart de dealer omdraait. Lukt het, dan moet de dealer drinken.",
      min: 3, max: 10, ideal: [4, 8], duration: "15–25 min", level: "Makkelijk",
      calc(n) {
        return {
          stats: [
            [1, "kaartspel (zonder jokers)"],
            [2, "gokken per beurt"],
            [3, "fouten op rij en de dealer wisselt"],
            [13, "rijtjes op tafel (2 t/m Aas)"]
          ],
          note: "Omgedraaide kaarten leg je open per waarde op tafel. Zo kan iedereen tellen wat er nog in de stapel zit."
        };
      },
      goal: "Als speler wil je de kaart goed raden zodat de dealer drinkt. Als dealer hoop je dat iedereen ernaast zit.",
      prep: n => [
        "Kies een dealer. Die houdt het geschudde kaartspel dicht in de hand.",
        "Maak ruimte op tafel voor dertien rijtjes: 2 t/m 10, Boer, Vrouw, Heer, Aas.",
        "De speler links van de dealer begint met raden."
      ],
      play: [
        "De speler noemt een waarde, bijvoorbeeld ‘vrouw’. De dealer kijkt naar de bovenste kaart.",
        "Goed in één keer? Dan drinkt de dealer [[4]].",
        "Fout? De dealer zegt alleen ‘hoger’ of ‘lager’. De speler mag nog één keer raden. Goed = dealer drinkt [[2]].",
        "Ook de tweede gok fout? Dan drinkt de speler [[2]].",
        "De kaart gaat open in zijn rijtje op tafel en de volgende speler is aan de beurt.",
        "Raden drie spelers achter elkaar fout, dan is de dealer er vanaf. De speler links van hem wordt de nieuwe dealer."
      ],
      drinks: [
        { w: "Speler raadt het in één keer", n: "De dealer drinkt.", s: 4 },
        { w: "Speler raadt het in twee keer", n: "De dealer drinkt.", s: 2 },
        { w: "Speler zit er twee keer naast", n: "De speler drinkt.", s: 2 },
        { w: "Dealer zegt per ongeluk het verkeerde", n: "Hoger in plaats van lager, of andersom.", s: 3 }
      ],
      tips: [
        "Kijk naar de rijtjes op tafel. Liggen er al drie vrouwen, dan is de kans op nog een vrouw klein.",
        "Echt stevig: bij een fout drinkt de speler het verschil tussen zijn gok en de echte kaart (Boer = 11, Vrouw = 12, Heer = 13, Aas = 14)."
      ]
    }
  ];

  /* ---------- Helpers ---------- */
  function fitOf(g, n) {
    if (n < g.min || n > g.max) return { cls: "niet", label: "Niet met " + n };
    if (n >= g.ideal[0] && n <= g.ideal[1]) return { cls: "ideal", label: "Ideaal" };
    return { cls: "kan", label: "Kan prima" };
  }
  function suitCls(s) { return RED.includes(s) ? "red" : ""; }
  function idx(g, pos) {
    return '<span class="idx ' + pos + " " + suitCls(g.suit) + '" aria-hidden="true"><span class="r">' + esc(g.rank) + '</span><span class="s">' + g.suit + "</span></span>";
  }
  const app = document.getElementById("app");
  function reduceMotion() { return window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches; }
  const FAN_SUITS = ["♠", "♥", "♣", "♦"];
  function fanHtml(n) {
    const spread = Math.min(16, 120 / Math.max(n - 1, 1));
    let s = "";
    for (let k = 0; k < n; k++) {
      const a = (k - (n - 1) / 2) * spread;
      const suit = FAN_SUITS[k % 4];
      s += '<span class="seat ' + suitCls(suit) + '" style="--a:' + a.toFixed(1) + "deg;--k:" + k + ";z-index:" + k + '">' + suit + "</span>";
    }
    return '<div class="table-fan" aria-hidden="true"><div class="fan">' + s + '</div><span class="fan-cap"><b>' + n + "</b> " + (n === 1 ? "speler" : "spelers") + " aan tafel</span></div>";
  }

  /* ---------- Overzicht ---------- */
  function renderHome() {
    const n = state.n;
    const list = GAMES.map(g => ({ g, f: fitOf(g, n) }));
    const fits = list.filter(x => x.f.cls !== "niet").length;
    const shown = state.onlyFit ? list.filter(x => x.f.cls !== "niet") : list;
    app.innerHTML =
      '<div class="wrap">' +
        '<section class="intro">' +
          '<div class="intro-text">' +
            '<h1>Kaartspellen voor aan tafel, <em>met slokken</em>.</h1>' +
            "<p>Stel bovenin in met hoeveel je bent en hoe stevig je het wilt. Elk spel past zich daarop aan: hoeveel kaartspellen je nodig hebt, hoeveel kaarten iedereen krijgt en hoeveel slokken er bij elke regel horen.</p>" +
          "</div>" +
          fanHtml(n) +
        "</section>" +
        '<div class="filterrow">' +
          '<span class="count"><b>' + fits + " van de " + GAMES.length + "</b> spellen zijn te spelen met " + n + " spelers</span>" +
          '<label class="toggle" for="only-fit"><input type="checkbox" id="only-fit"' + (state.onlyFit ? " checked" : "") + "> Alleen wat past</label>" +
        "</div>" +
        '<div class="hand">' +
          shown.map(({ g, f }, i) =>
            '<button class="pcard' + (f.cls === "niet" ? " off" : "") + '" data-id="' + g.id + '" style="--i:' + i + ";--dx:" + ((i % 4) - 1.5) * -60 + "px;--dr:" + (i % 2 ? 12 : -14) + 'deg">' +
              idx(g, "tl") + idx(g, "br") +
              '<span class="fit ' + f.cls + '">' + f.label + "</span>" +
              "<h2>" + esc(g.name) + "</h2>" +
              "<p>" + esc(g.tagline) + "</p>" +
              '<span class="meta"><span>' + g.min + "–" + g.max + " spelers</span><span>" + g.duration + "</span></span>" +
            "</button>"
          ).join("") +
        "</div>" +
      "</div>";
    app.querySelectorAll(".pcard").forEach(b => {
      b.addEventListener("click", () => { location.hash = b.dataset.id; });
      b.addEventListener("pointermove", e => {
        if (e.pointerType !== "mouse" || reduceMotion()) return;
        const r = b.getBoundingClientRect();
        const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
        b.style.setProperty("--ry", ((x - .5) * 14).toFixed(2) + "deg");
        b.style.setProperty("--rx", ((.5 - y) * 12).toFixed(2) + "deg");
        b.style.setProperty("--gx", (x * 100).toFixed(1) + "%");
        b.style.setProperty("--gy", (y * 100).toFixed(1) + "%");
      });
      b.addEventListener("pointerleave", () => { b.style.setProperty("--rx", "0deg"); b.style.setProperty("--ry", "0deg"); });
    });
    document.getElementById("only-fit").addEventListener("change", e => { state.onlyFit = e.target.checked; save(); renderHome(); });
  }

  /* ---------- Spelpagina ---------- */
  function renderGame(g, keepScroll) {
    const n = state.n;
    const f = fitOf(g, n);
    const c = g.calc(n);
    let warn = "";
    if (n < g.min) warn = "Met " + n + " spelers is dit spel eigenlijk te klein. Je hebt er minstens " + g.min + " nodig.";
    else if (n > g.max) warn = "Met " + n + " spelers wordt het rommelig. Meer dan " + g.max + " raden we niet aan; splits liever in twee groepen.";

    const statsHtml = c.stats.map(s =>
      '<div class="stat' + (s[2] ? " wide" : "") + '"><b>' + esc(s[0]) + "</b><small>" + esc(s[1]) + "</small></div>"
    ).join("");
    const rolesHtml = c.roles
      ? "<h3>Rollen met " + n + " spelers</h3><ol class=\"roles\">" + c.roles.map((r, i) => '<li style="--i:' + i + '"><span>' + esc(r[0]) + "</span><span>" + esc(r[1]) + "</span></li>").join("") + "</ol>"
      : "";

    const cardsHtml = g.cards
      ? '<section class="sec" style="--i:3"><h2><span class="pip ' + suitCls(g.suit) + '">' + g.suit + "</span>Wat doet elke kaart?</h2>" +
          '<div class="draw"><button class="btn" id="draw-btn">Trek een kaart</button>' +
          '<div class="drawn" id="drawn" aria-hidden="true">?</div>' +
          '<div class="drawtxt" id="drawtxt" aria-live="polite">Probeer het uit: trek een willekeurige kaart en zie welke regel erbij hoort.</div></div>' +
          '<div class="cardrules">' + g.cards.map(k =>
            '<div class="crule" data-r="' + k.r + '"><div class="crank">' + esc(k.r) + "</div><div><b>" + esc(k.t) + "</b><span>" + rich(k.d) + "</span></div></div>"
          ).join("") + "</div></section>"
      : "";

    app.innerHTML =
      '<div class="wrap">' +
        '<button class="back" id="back-btn">← Alle spellen</button>' +
        '<section class="ghero">' +
          '<div class="bigcard" aria-hidden="true">' + idx(g, "tl") + '<span class="' + suitCls(g.suit) + '">' + g.suit + "</span>" + idx(g, "br") + "</div>" +
          "<div><h1>" + esc(g.name) + '</h1><p class="tag">' + esc(g.tagline) + "</p>" +
            '<div class="chips">' +
              '<span class="chip fit ' + f.cls + '" style="border-width:1.5px">' + f.label + "</span>" +
              '<span class="chip">' + g.min + "–" + g.max + " <span>spelers</span></span>" +
              '<span class="chip">' + g.ideal[0] + "–" + g.ideal[1] + " <span>ideaal</span></span>" +
              '<span class="chip">' + g.duration + "</span>" +
              '<span class="chip">' + g.level + "</span>" +
            "</div></div>" +
        "</section>" +
        '<div class="cols">' +
          "<div>" +
            '<section class="sec" style="--i:0"><h2>Doel van het spel</h2><p>' + rich(g.goal) + "</p></section>" +
            '<section class="sec" style="--i:1"><h2>Voorbereiding</h2><ol class="steps">' + g.prep(n).map(s => "<li><span>" + rich(s) + "</span></li>").join("") + "</ol></section>" +
            '<section class="sec" style="--i:2"><h2>Zo speel je</h2><ol class="steps">' + g.play.map(s => "<li><span>" + rich(s) + "</span></li>").join("") + "</ol></section>" +
            cardsHtml +
            '<section class="sec" style="--i:4"><h2>Slokkenregels</h2><div class="drinks">' + g.drinks.map((d, i) =>
              '<div class="drink" style="--i:' + i + '"><div><div class="w">' + rich(d.w) + "</div>" + (d.n ? '<div class="n">' + rich(d.n) + "</div>" : "") + "</div>" + coaster(d.s) + "</div>"
            ).join("") + "</div></section>" +
            '<section class="sec" style="--i:5"><h2>Huisregels &amp; tips</h2><ul class="bul">' + g.tips.map(t => "<li>" + rich(t) + "</li>").join("") + "</ul></section>" +
          "</div>" +
          '<aside class="aside"><div class="table-panel" style="--i:1">' +
            "<h3>Met " + n + " spelers heb je nodig</h3>" +
            (warn ? '<div class="warnbox">' + esc(warn) + "</div>" : "") +
            '<div class="stats">' + statsHtml + "</div>" +
            rolesHtml +
            (c.note ? '<p class="panel-note">' + esc(c.note) + "</p>" : "") +
          "</div></aside>" +
        "</div>" +
      "</div>";

    document.getElementById("back-btn").addEventListener("click", () => { location.hash = ""; });
    const db = document.getElementById("draw-btn");
    if (db) db.addEventListener("click", () => drawCard(g));
    if (!keepScroll) window.scrollTo(0, 0);
  }

  function drawCard(g) {
    const suits = ["♥", "♦", "♣", "♠"];
    let ranks = g.cards.map(k => k.r).filter(r => r !== "J");
    let r, s;
    const hasJoker = g.cards.some(k => k.r === "J");
    // Pesten: draw from a full deck so normal cards show up too
    if (g.id === "pesten") {
      const full = ["2","3","4","5","6","7","8","9","10","B","V","H","A"];
      const pool = [];
      full.forEach(x => suits.forEach(y => pool.push([x, y])));
      if (hasJoker) { pool.push(["J", ""]); pool.push(["J", ""]); }
      [r, s] = pool[Math.floor(Math.random() * pool.length)];
    } else {
      r = ranks[Math.floor(Math.random() * ranks.length)];
      s = suits[Math.floor(Math.random() * 4)];
    }
    const el = document.getElementById("drawn");
    el.classList.remove("flip"); void el.offsetWidth; el.classList.add("flip");
    el.className = "drawn flip " + (RED.includes(s) ? "red" : "");
    el.innerHTML = r === "J" ? "🃏" : esc(r) + "<br>" + s;
    const rule = g.cards.find(k => k.r === r);
    const txt = document.getElementById("drawtxt");
    document.querySelectorAll(".crule").forEach(x => x.classList.toggle("hit", x.dataset.r === r));
    if (rule) {
      txt.innerHTML = "<b>" + (r === "J" ? "Joker" : esc(r) + " " + s) + ": " + esc(rule.t) + "</b>" + rich(rule.d);
    } else {
      txt.innerHTML = "<b>" + esc(r) + " " + s + ": gewone kaart</b>Geen speciale actie. Leg hem op kleur of waarde.";
    }
  }

  /* ---------- Bediening ---------- */
  const out = document.getElementById("pl-out");
  const minB = document.getElementById("pl-min");
  const plusB = document.getElementById("pl-plus");
  const levelEl = document.getElementById("level");
  levelEl.innerHTML = LEVELS.map(l => '<button data-l="' + l.id + '" id="lv-' + l.id + '">' + l.label + "</button>").join("");

  function syncControls() {
    out.textContent = state.n;
    minB.disabled = state.n <= 2;
    plusB.disabled = state.n >= 20;
    levelEl.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.l === state.level)));
  }
  function route(keepScroll, kind) {
    syncControls();
    app.className = kind === "n" ? "bump-n" : kind === "lv" ? "bump-lv" : "enter";
    const id = location.hash.replace("#", "");
    const g = GAMES.find(x => x.id === id);
    if (g) { document.title = g.name + " · Kaarten & Slokken"; renderGame(g, keepScroll); }
    else { document.title = "Kaarten & Slokken"; renderHome(); if (!keepScroll) window.scrollTo(0, 0); }
  }
  minB.addEventListener("click", () => { if (state.n > 2) { state.n--; save(); route(true, "n"); } });
  plusB.addEventListener("click", () => { if (state.n < 20) { state.n++; save(); route(true, "n"); } });
  levelEl.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b || b.dataset.l === state.level) return;
    state.level = b.dataset.l; save(); route(true, "lv");
  });
  document.getElementById("home-btn").addEventListener("click", () => { location.hash = ""; });
  window.addEventListener("hashchange", () => route(false));
  route(false);
})();
</script>
</body>
</html>
