name: Update source (collect IPAs)

# Houdt de bron-JSON automatisch up-to-date: haalt de nieuwste IPA's uit de
# private app-repos en publiceert ze hier. Draait op ubuntu (GRATIS voor publieke
# repos) — geen macOS-minuten nodig, want er wordt niets gecompileerd.
on:
  workflow_dispatch: # handmatige knop
  schedule:
    - cron: "*/30 * * * *" # elk half uur nieuwe app-builds oppikken
  repository_dispatch:
    # De app-repo's sturen dit zodra hun build een release heeft gepubliceerd.
    # Dat is de betrouwbare weg: de cron hieronder wordt door GitHub afgeknepen
    # en draaide in de praktijk uren uit elkaar in plaats van elk half uur.
    types: [new-ipa]

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect IPA's en schrijf bron
        env:
          # PAT met leesrechten op de private app-repos. Zet 'm bij:
          # dist-repo → Settings → Secrets and variables → Actions → New secret
          GH_TOKEN: ${{ secrets.DIST_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            # Bewust falen, niet stilletjes slagen. Zonder token haalt deze
            # workflow niets op, en een groen vinkje bij een bron die
            # maandenlang stilstaat is erger dan een rood kruis.
            echo "::error::DIST_TOKEN ontbreekt. Zonder dat token kan deze"
            echo "::error::workflow niet in de private app-repos kijken en"
            echo "::error::blijft de bron op de oude versies staan."
            echo "::error::Zet hem bij: Settings -> Secrets and variables ->"
            echo "::error::Actions -> New repository secret, naam DIST_TOKEN."
            exit 1
          fi
          bash scripts/collect.sh

      - name: Commit bijgewerkte apps.json
        run: |
          git config user.name "JackvanHecke"
          git config user.email "jackvanhecke1@gmail.com"
          git add -A
          git commit -m "chore: update source (collect)" || echo "geen wijziging"
          git push
